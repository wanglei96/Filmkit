name: android-ci

# 2026-09-30：改为**仅手动触发**。此前 push: branches:[main] 会在每次推送时
# 自动构建，而私有仓库 Actions storage 配额只有 500MB —— 一轮对话推了 6 个
# tag/多次 commit，直接把配额顶爆、CI 报红。出包本来就是本地做
#（filmkit-<versionName>.apk 单文件覆盖制），CI 的价值只在"偶尔验证一次
# 干净环境能否 build + 单测"，手动触发足够。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK；NDK 版本由 AGP 按需获取
      - name: Build & unit test
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      # v0.10.39：不再上传 APK artifact —— 私有仓库 Actions storage 配额
      # 500MB，29MB/次很快占满，push 后 artifact 上传失败报红。出包一律本地
      # （filmkit-<versionName>.apk 单文件覆盖制），CI 只做构建+单测验证。
